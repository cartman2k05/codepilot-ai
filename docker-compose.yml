# ============================================================
# CodePilot AI — Docker Compose
# ============================================================
# Usage:
#   docker-compose up --build        # Start all services
#   docker-compose up -d             # Start in background
#   docker-compose down -v           # Stop and remove volumes
# ============================================================

version: "3.9"

services:
  # ── PostgreSQL 16 ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: codepilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codepilot
      POSTGRES_PASSWORD: codepilot
      POSTGRES_DB: codepilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codepilot -d codepilot"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - codepilot-network

  # ── Redis 7 ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: codepilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - codepilot-network

  # ── Hindsight (Persistent Memory Server) ───────────────────
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: codepilot-hindsight
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      LLM_PROVIDER: groq
      LLM_API_KEY: ${GROQ_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - codepilot-network

  # ── Backend (FastAPI + LangGraph) ──────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codepilot-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://codepilot:codepilot@postgres:5432/codepilot}
      GROQ_API_KEY: ${GROQ_API_KEY}
      HINDSIGHT_URL: ${HINDSIGHT_URL:-http://hindsight:8888}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-secure-random-string-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      CASCADEFLOW_BUDGET: ${CASCADEFLOW_BUDGET:-1.0}
      CASCADEFLOW_MODE: ${CASCADEFLOW_MODE:-enforce}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
    depends_on:
      postgres:
        condition: service_healthy
      hindsight:
        condition: service_started
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - codepilot-network

  # ── Frontend (Next.js 14) ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codepilot-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    networks:
      - codepilot-network

# ── Volumes ──────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local

# ── Networks ─────────────────────────────────────────────────
networks:
  codepilot-network:
    driver: bridge
