# ============================================================
# CodePilot AI — Docker Compose (Local Development)
# ============================================================
# Usage:
#   docker-compose up --build        # Start all services
#   docker-compose up -d             # Start in background
#   docker-compose down -v           # Stop and remove volumes
#
# Production deployment uses split managed platforms:
#   Database  → Neon (free serverless Postgres)
#   Memory    → Hindsight Cloud (https://hindsight.vectorize.io)
#   Backend   → Render or Railway (Docker web service)
#   Frontend  → Vercel
#
# Redis and self-hosted Hindsight are NOT needed — the backend
# never touches Redis directly, and Hindsight Cloud replaces
# the local container.
# ============================================================

version: "3.9"

services:
  # ── PostgreSQL 16 (local dev only — use Neon in production) ──
  postgres:
    image: postgres:16-alpine
    container_name: codepilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codepilot
      POSTGRES_PASSWORD: codepilot
      POSTGRES_DB: codepilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codepilot -d codepilot"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - codepilot-network

  # ── Backend (FastAPI + LangGraph) ──────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codepilot-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # In production, set DATABASE_URL to your Neon connection string
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://codepilot:codepilot@postgres:5432/codepilot}
      GROQ_API_KEY: ${GROQ_API_KEY}
      # In production, point at Hindsight Cloud and set HINDSIGHT_API_KEY
      HINDSIGHT_URL: ${HINDSIGHT_URL:-https://api.hindsight.vectorize.io}
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:-}
      # In production, set JWT_SECRET to a strong random value: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-secure-random-string-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      # In production, set CORS_ORIGINS to your Vercel frontend URL
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - codepilot-network

  # ── Frontend (Next.js 14) ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codepilot-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # In production (Vercel), set NEXT_PUBLIC_API_URL to your Render/Railway backend URL
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    networks:
      - codepilot-network

# ── Volumes ──────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local

# ── Networks ─────────────────────────────────────────────────
networks:
  codepilot-network:
    driver: bridge
